# =============================================================
# Bearing Fault Diagnosis — Local Compose Stack
# =============================================================
# Run from the repo root:
#   docker compose -f deployment/docker-compose.yml up --build   # first run
#   docker compose -f deployment/docker-compose.yml up           # subsequent runs
#   docker compose -f deployment/docker-compose.yml down         # stop and remove
#
# API will be available at:
#   http://localhost:8000/predict
#   http://localhost:8000/docs     (Swagger UI)
# =============================================================

services:
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: bearing-fault-api:latest
    container_name: bearing-fault-api
    ports:
      - "8000:8000"
    volumes:
      # Mount trained model artefacts read-only.
      # Run BearingFault_Training.ipynb on the host first to populate mlruns/.
      - ../mlruns:/app/mlruns:ro
    environment:
      # Suppress MLflow progress bars in container logs
      - MLFLOW_ENABLE_ARTIFACTS_PROGRESS_BAR=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
