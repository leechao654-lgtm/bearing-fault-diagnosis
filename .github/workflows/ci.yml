# =============================================================
# CI — Unit Tests + Deployment Smoke Test
# =============================================================
# Runs on every push and pull request.
# Does NOT need AWS credentials or the Paderborn dataset:
#   - unit tests use synthetic signals
#   - the deployment image is built from the mlruns/ already committed to git
# =============================================================

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: deployment/requirements-inference.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r deployment/requirements-inference.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        run: pytest utils/test_features.py -v --tb=short --cov=utils --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: .coverage

  docker-smoke-test:
    name: Docker Build & Smoke Test (deployment image)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build deployment image
        run: docker build -f deployment/Dockerfile -t bearing-fault-api:ci .

      - name: Run container
        run: docker run -d --name ci-smoke -p 8000:8000 bearing-fault-api:ci

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "Service healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Service did not become healthy in time"
          docker logs ci-smoke
          exit 1

      - name: Tear down
        if: always()
        run: docker rm -f ci-smoke || true
